[workspace]
members = ["crates/tish_winint"]
resolver = "2"

[package]
name = "tish-shadertoy"
version = "0.1.0"
edition = "2021"
description = "Run Shadertoy GLSL shaders in a native OpenGL window, driven from Tish"
license = "MIT"
repository = "https://github.com/spacedevin/tish-shadertoy"

[[bin]]
name = "tish-shadertoy-run"
path = "src/bin/tish-shadertoy-run.rs"

[dependencies]
tish_winint = { path = "crates/tish_winint", package = "tish-winint" }
tishlang_core = "4.2.5"
tishlang_eval = { version = "4.2.5", features = ["process", "fs", "regex"] }
tishlang_parser = "4.2.5"
winit = "0.30.13"
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
glow = "0.17.0"
chrono = "0.4.44"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"
